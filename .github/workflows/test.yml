name: Test plugins and skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    name: Portable skills on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install openpyxl pyyaml
      - name: Validate marketplace, plugins and portable Agent Skills
        run: python scripts/validate_plugins.py
      - name: Run unit tests for all skills
        run: |
          for test_dir in plugins/*/skills/*/tests; do
            if [ -d "$test_dir" ] && compgen -G "$test_dir/test*.py" > /dev/null; then
              echo "Running tests in $test_dir..."
              python -m unittest discover -s "$test_dir" -v
            fi
          done
      - name: Check derived schemas where present
        run: |
          for skill_dir in plugins/*/skills/*; do
            if [ -f "$skill_dir/scripts/build_schema.py" ]; then
              echo "Checking schema in $skill_dir..."
              (cd "$skill_dir" && python scripts/build_schema.py --check)
            fi
          done
      - name: Check licence notices
        run: |
          cmp LICENSE plugins/openfunds-tools/LICENSE
          cmp NOTICE plugins/openfunds-tools/NOTICE
          cmp THIRD_PARTY_NOTICES.md plugins/openfunds-tools/THIRD_PARTY_NOTICES.md
          for skill_dir in plugins/*/skills/*; do
            if [ -d "$skill_dir" ]; then
              test -f "$skill_dir/LICENSE"
              test -f "$skill_dir/NOTICE"
            fi
          done

  claude-packaging:
    name: Claude marketplace packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm install --global @anthropic-ai/claude-code@2.1.263
      - name: Validate marketplace and plugins
        run: |
          claude plugin validate . --strict
          for plugin_dir in plugins/*; do
            if [ -d "$plugin_dir" ]; then
              claude plugin validate "$plugin_dir" --strict
            fi
          done
